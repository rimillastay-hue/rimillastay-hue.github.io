<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRQ CELLULAR - Konter Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-[#fff5f5] min-h-screen p-3">
<div class="max-w-md mx-auto">
<div class="bg-white rounded-[20px] shadow-sm p-4 mb-3 flex justify-between items-center border">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-black text-lg">R</div>
<div><h1 class="font-extrabold text-[15px] leading-none tracking-wide">RRQ CELLULAR</h1><p class="text-[11px] text-gray-400 mt-1">Konter Pulsa & Kuota • Pekanbaru</p></div>
</div>
<div id="status" class="text-[11px] font-bold px-3 py-1.5 rounded-full bg-yellow-100 text-yellow-700">Menghubungkan...</div>
</div>

<div class="bg-white rounded-[20px] shadow-sm p-4 mb-3 border">
<h2 class="font-bold text-sm mb-3">Tambah Stok Baru</h2>
<input id="nama" placeholder="Nama barang (cth: Voucher Axis 5GB)" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 mb-2.5 text-sm">
<div class="grid grid-cols-3 gap-2.5 mb-3">
<input id="modal" type="number" placeholder="Modal" class="bg-gray-50 border border-gray-100 rounded-xl p-3 text-sm">
<input id="jual" type="number" placeholder="Jual" class="bg-gray-50 border border-gray-100 rounded-xl p-3 text-sm">
<input id="sisa" type="number" placeholder="Jml" class="bg-gray-50 border border-gray-100 rounded-xl p-3 text-sm">
</div>
<button onclick="tambahStok()" class="w-full bg-red-600 text-white rounded-xl py-3.5 font-bold text-sm">SIMPAN KE SUPABASE (ONLINE)</button>
<p id="msg" class="text-center text-xs mt-2 text-gray-400"></p>
</div>

<div class="bg-white rounded-[20px] shadow-sm p-4 mb-3 border">
<div class="flex justify-between items-center mb-3"><h2 class="font-bold text-sm">Stok Saat Ini</h2><span id="jmlStok" class="text-xs bg-gray-100 px-2 py-1 rounded-full">0 item</span></div>
<div id="listStok" class="space-y-2.5"></div>
</div>

<div class="bg-white rounded-[20px] shadow-sm p-4 mb-3 border">
<h2 class="font-bold text-sm mb-3">Jual Barang</h2>
<select id="pilihBarang" class="w-full bg-gray-50 border rounded-xl p-3 mb-2.5 text-sm"></select>
<div class="grid grid-cols-2 gap-2.5 mb-3">
<input id="jmlJual" type="number" value="1" class="bg-gray-50 border rounded-xl p-3 text-sm">
<div class="bg-red-50 rounded-xl p-3 text-center"><p class="text-[10px] text-red-500">UNTUNG</p><p id="previewUntung" class="font-bold text-red-700 text-sm">Rp 0</p></div>
</div>
<button onclick="jualBarang()" class="w-full bg-green-600 text-white rounded-xl py-3.5 font-bold text-sm">JUAL & CATAT UNTUNG</button>
</div>

<div class="bg-white rounded-[20px] shadow-sm p-4 border">
<h2 class="font-bold text-sm mb-3">Transaksi Hari Ini</h2>
<div id="listTransaksi"></div>
<div class="mt-3 pt-3 border-t flex justify-between font-bold"><span>Total Untung:</span><span id="totalUntung" class="text-green-600">Rp 0</span></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://jmukkudafhilkbllirue.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdWtrdWRhZmhpbGtibGxpcnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mzg3NDUsImV4cCI6MjEwNjExNDc0NX0.BqxV1PS2Ypt5MSh5ItVDndOD05lrZdq_wFC9w1hDqXY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let stokCache=[];
async function init(){
  const { error } = await supabaseClient.from('stok').select('id').limit(1);
  if(!error){
    document.getElementById('status').textContent='● ONLINE - Sinkron';
    document.getElementById('status').className='text-[11px] font-bold px-3 py-1.5 rounded-full bg-green-100 text-green-700';
    loadStok(); loadTransaksi();
  }
}
async function loadStok(){
  const { data } = await supabaseClient.from('stok').select('*').order('id',{ascending:false});
  stokCache=data||[];
  const valid=stokCache.filter(s=>s.nama);
  document.getElementById('jmlStok').textContent=valid.length+' item';
  document.getElementById('listStok').innerHTML=valid.map(s=>`<div class="flex justify-between items-center border rounded-xl p-3"><div><div class="font-bold text-[13px]">${s.nama}</div><div class="text-[11px] text-gray-500">Sisa ${s.sisa}</div></div><button onclick="hapusStok(${s.id})" class="w-8 h-8 rounded-full bg-gray-50">✕</button></div>`).join('') || '<p class="text-center text-xs text-gray-400 py-6">Belum ada stok</p>';
  document.getElementById('pilihBarang').innerHTML=valid.filter(s=>s.sisa>0).map(s=>`<option value="${s.id}">${s.nama} - sisa ${s.sisa}</option>`).join('') || '<option>Belum ada barang</option>';
  updatePreview();
}
function updatePreview(){
  const id=document.getElementById('pilihBarang').value;
  const jml=parseInt(document.getElementById('jmlJual').value)||1;
  const b=stokCache.find(x=>x.id==id);
  document.getElementById('previewUntung').textContent=b?'Rp '+((b.jual-b.modal)*jml).toLocaleString('id-ID'):'Rp 0';
}
document.getElementById('pilihBarang').addEventListener('change',updatePreview);
document.getElementById('jmlJual').addEventListener('input',updatePreview);
async function loadTransaksi(){
  const { data } = await supabaseClient.from('transaksi').select('*').order('id',{ascending:false}).limit(30);
  let total=0;
  document.getElementById('listTransaksi').innerHTML=(data||[]).map(t=>{ total+=(t.untung||0)*(t.jumlah||1); return `<div class="flex justify-between border-b py-2 text-xs"><span>${t.nama_barang} x${t.jumlah||1}</span><span class="font-bold text-green-600">+Rp${t.untung}</span></div>`}).join('');
  document.getElementById('totalUntung').textContent='Rp '+total.toLocaleString('id-ID');
}
async function tambahStok(){
  const nama=document.getElementById('nama').value.trim();
  const modal=parseInt(document.getElementById('modal').value);
  const jual=parseInt(document.getElementById('jual').value);
  const sisa=parseInt(document.getElementById('sisa').value);
  await supabaseClient.from('stok').insert([{nama,modal,jual,sisa}]);
  loadStok();
}
async function hapusStok(id){ await supabaseClient.from('stok').delete().eq('id',id); loadStok(); }
async function jualBarang(){
  const id=document.getElementById('pilihBarang').value;
  const jml=parseInt(document.getElementById('jmlJual').value)||1;
  const { data: barang } = await supabaseClient.from('stok').select('*').eq('id',id).single();
  await supabaseClient.from('stok').update({sisa: barang.sisa - jml}).eq('id',id);
  await supabaseClient.from('transaksi').insert([{jenis:'jual', nama_barang: barang.nama, modal: barang.modal, jual: barang.jual, untung: barang.jual-barang.modal, jumlah: jml}]);
  loadStok(); loadTransaksi();
}
init();
</script>
</body>
  </html>
