<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Konter BRILink</title>
    <style>
        :root {
            --bri-blue: #00529C;
            --bri-orange: #F15A24;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--bri-blue);
            margin-bottom: 20px;
            border-bottom: 3px solid var(--bri-orange);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--bri-blue);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #003f78;
        }
        
        /* Struk Area (Sembunyi di layar, muncul saat cetak) */
        #struk-area {
            display: none;
            font-family: 'Courier New', Courier, monospace;
            width: 300px;
            margin: auto;
            padding: 10px;
            border: 1px dashed #000;
        }
        .text-center { text-align: center; }
        .line { border-top: 1px dashed #000; margin: 10px 0; }
        .flex { display: flex; justify-content: space-between; }

        @media print {
            body * { visibility: hidden; }
            #struk-area, #struk-area * { visibility: visible; }
            #struk-area { display: block; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AGEN BRILink KASIR</h2>
    
    <div class="form-group">
        <label for="jenis">Jenis Transaksi</label>
        <select id="jenis">
            <option value="Transfer BRI">Transfer BRI</option>
            <option value="Transfer Bank Lain">Transfer Bank Lain</option>
            <option value="Tarik Tunai">Tarik Tunai</option>
            <option value="Setor Tunai">Setor Tunai</option>
            <option value="Bayar Listrik/PLN">Bayar Listrik/PLN</option>
            <option value="Pulsa / Kuota">Pulsa / Kuota</option>
        </select>
    </div>

    <div class="form-group">
        <label for="tujuan">Nomor Rekening / Target</label>
        <input type="text" id="tujuan" placeholder="Masukkan nomor rekening/HP">
    </div>

    <div class="form-group">
        <label for="nominal">Nominal Transaksi (Rp)</label>
        <input type="number" id="nominal" placeholder="Contoh: 500000" oninput="hitungTotal()">
    </div>

    <div class="form-group">
        <label for="admin">Biaya Admin Agen (Rp)</label>
        <input type="number" id="admin" placeholder="Contoh: 5000" value="5000" oninput="hitungTotal()">
    </div>

    <div class="form-group">
        <label>Total yang Harus Dibayar</label>
        <input type="text" id="total" readonly style="background-color: #e9ecef; font-weight: bold; color: var(--bri-orange);">
    </div>

    <button onclick="cetakStruk()">CETAK STRUK KASIR</button>
</div>

<!-- Template Struk Digital -->
<div id="struk-area">
    <div class="text-center">
        <h3>STRUK TRANSAKSI BRILink</h3>
        <p>Nama Agen: Agen BRILink Sukses</p>
        <p id="p-waktu"></p>
    </div>
    <div class="line"></div>
    <div class="flex"><p>Jenis:</p><p id="s-jenis"></p></div>
    <div class="flex"><p>Tujuan/Rek:</p><p id="s-tujuan"></p></div>
    <div class="line"></div>
    <div class="flex"><p>Nominal:</p><p id="s-nominal"></p></div>
    <div class="flex"><p>Admin Agen:</p><p id="s-admin"></p></div>
    <div class="line"></div>
    <div class="flex" style="font-weight: bold;"><p>TOTAL:</p><p id="s-total"></p></div>
    <div class="line"></div>
    <div class="text-center">
        <p>TERIMA KASIH</p>
        <p>Simpan struk ini sebagai bukti sah</p>
    </div>
</div>

<script>
    function hitungTotal() {
        const nominal = parseFloat(document.getElementById('nominal').value) || 0;
        const admin = parseFloat(document.getElementById('admin').value) || 0;
        const total = nominal + admin;
        
        document.getElementById('total').value = "Rp " + total.toLocaleString('id-ID');
    }

    function cetakStruk() {
        // Ambil data input
        const jenis = document.getElementById('jenis').value;
        const tujuan = document.getElementById('tujuan').value || '-';
        const nominal = parseFloat(document.getElementById('nominal').value) || 0;
        const admin = parseFloat(document.getElementById('admin').value) || 0;
        const total = nominal + admin;
        const waktu = new Date().toLocaleString('id-ID');

        // Validasi input minimal
        if(nominal <= 0) {
            alert("Harap isi nominal transaksi terlebih dahulu!");
            return;
        }

        // Masukkan data ke struk
        document.getElementById('p-waktu').innerText = waktu;
        document.getElementById('s-jenis').innerText = jenis;
        document.getElementById('s-tujuan').innerText = tujuan;
        document.getElementById('s-nominal').innerText = "Rp " + nominal.toLocaleString('id-ID');
        document.getElementById('s-admin').innerText = "Rp " + admin.toLocaleString('id-ID');
        document.getElementById('s-total').innerText = "Rp " + total.toLocaleString('id-ID');

        // Panggil fungsi cetak browser (bisa dihubungkan ke printer thermal)
        window.print();
    }
</script>

</body>
</html>
