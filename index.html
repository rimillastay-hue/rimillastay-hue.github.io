<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRQ CELLULAR</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
</head><body class="bg-[#f0f0f0] max-w-md mx-auto min-h-screen p-3 font-sans">

<!-- HEADER SIMPEL RRQ -->
<div class="bg-white p-4 rounded-2xl flex justify-between border">
<b>RRQ CELLULAR</b><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px]">Zulbakri</span>
</div>

<!-- MENU INPUT SIMPEL -->
<div class="bg-white p-4 rounded-2xl border mt-3">
<div class="grid grid-cols-4 gap-2 mb-3 text-[10px] font-bold">
<button onclick="setJ('PENJUALAN')" id="b-PENJUALAN" class="bg-black text-white p-3 rounded-xl">PENJUALAN</button>
<button onclick="setJ('NONBARANG')" id="b-NONBARANG" class="bg-gray-100 p-3 rounded-xl">NON BARANG</button>
<button onclick="setJ('TARIK')" id="b-TARIK" class="bg-gray-100 p-3 rounded-xl">TARIK</button>
<button onclick="setJ('SETORAN')" id="b-SETORAN" class="bg-gray-100 p-3 rounded-xl">SETORAN</button>
</div>

<div class="grid grid-cols-4 gap-2 mb-3 text-[10px] font-bold" id="brandBox"></div>

<input id="ket" placeholder="Keterangan / No HP" class="w-full bg-gray-100 p-3 rounded-xl mb-2 text-[12px]">
<input id="mod" type="number" placeholder="Modal" class="w-full bg-gray-100 p-3 rounded-xl mb-2 text-[12px]">
<input id="unt" type="number" placeholder="Untung / Admin" class="w-full bg-green-50 border border-green-200 p-3 rounded-xl mb-3 text-[12px] font-bold">
<button onclick="simpan()" class="w-full bg-red-600 text-white p-3 rounded-xl font-bold">SIMPAN</button>
</div>

<!-- KAS AWAL - BISA BANYAK BANK & EWALLET - SIMPLE BISA DIPENCET -->
<div class="bg-white p-4 rounded-2xl border mt-3">
<b class="text-[12px]">UANG STANBY (SALDO AWAL)</b>
<div class="grid grid-cols-2 gap-2 mt-3">
<input id="kKes" type="number" placeholder="KES LACI" class="bg-gray-100 p-2 rounded-lg text-[11px]">
<input id="kBCA" type="number" placeholder="BCA" class="bg-blue-50 p-2 rounded-lg text-[11px]">
<input id="kBRI" type="number" placeholder="BRI" class="bg-blue-50 p-2 rounded-lg text-[11px]">
<input id="kMandiri" type="number" placeholder="MANDIRI" class="bg-blue-50 p-2 rounded-lg text-[11px]">
<input id="kDANA" type="number" placeholder="DANA" class="bg-purple-50 p-2 rounded-lg text-[11px]">
<input id="kOVO" type="number" placeholder="OVO" class="bg-purple-50 p-2 rounded-lg text-[11px]">
<input id="kGOPAY" type="number" placeholder="GOPAY" class="bg-purple-50 p-2 rounded-lg text-[11px]">
<input id="kSPAY" type="number" placeholder="SPAY" class="bg-purple-50 p-2 rounded-lg text-[11px]">
</div>
<button onclick="saveKas()" class="w-full bg-black text-white p-3 rounded-xl mt-3 text-[11px] font-bold">SIMPAN UANG STANBY</button>
</div>

<!-- LAPORAN PERSIS FOTO - SEMUA BISA DIPENCET -->
<div class="bg-white p-4 rounded-2xl border mt-3">
<div class="flex justify-between mb-3"><b class="text-[11px]" id="tgl">TRANSAKSI TGL</b><button onclick="load()" class="bg-green-600 text-white px-4 py-1 rounded text-[11px]">CARI</button></div>

<details class="border rounded-lg mb-2"><summary class="p-3 font-bold text-[12px] cursor-pointer">+ TR PENJUALAN (Rp. <span id="vPenj">0</span>)</summary><div id="cPenj" class="p-3 bg-gray-50 text-[11px]"></div></details>
<details class="border rounded-lg mb-2"><summary class="p-3 font-bold text-[12px] cursor-pointer">+ TR NON BARANG (Rp. <span id="vNon">0</span>)</summary><div id="cNon" class="p-3 bg-gray-50 text-[11px]"></div></details>
<details class="border rounded-lg mb-2"><summary class="p-3 font-bold text-[12px] cursor-pointer">TR TARIK TUNAI (- Rp. <span id="vTarikM">0</span>), (+ Rp. <span id="vTarikP">0</span>)</summary><div id="cTarik" class="p-3 bg-gray-50 text-[11px]"></div></details>
<details class="border rounded-lg mb-2"><summary class="p-3 font-bold text-[12px] cursor-pointer">+ UANG STANBY (Rp. <span id="vStanby">0</span>)</summary><div id="cStanby" class="p-3 bg-gray-50 text-[11px]"></div></details>
<details class="border rounded-lg"><summary class="p-3 font-bold text-[12px] cursor-pointer">- UANG SETORAN (Rp. <span id="vSetor">0</span>)</summary><div id="cSetor" class="p-3 bg-gray-50 text-[11px]"></div></details>

<div class="text-center mt-6"><div>TOTAL TR : <span id="totalTr">0</span></div><div>TOTAL UANG</div><b class="text-[24px]" id="totalUang">Rp. 0</b></div>
</div>

<script>
const sb=supabase.createClient("https://jmukkudafhilkbllirue.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdWtrdWRhZmhpbGtibGxpcnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mzg3NDUsImV4cCI6MjEwNjExNDc0NX0.BqxV1PS2Ypt5MSh5ItVDndOD05lrZdq_wFC9w1hDqXY");
let jenis='PENJUALAN', brand='AXIS';
let brands={PENJUALAN:['AXIS','XL','TSEL','ISAT','TRI','SF','BY.U','VOUCHER'], NONBARANG:['TOKEN','DANA','OVO','GOPAY','PULSA'], TARIK:['BCA','BRI','MANDIRI','BNI','BSI'], SETORAN:['BCA','BRI','BOS']};
function setJ(j){jenis=j; ['PENJUALAN','NONBARANG','TARIK','SETORAN'].forEach(k=>{document.getElementById('b-'+k).className=k==j?'bg-black text-white p-3 rounded-xl':'bg-gray-100 p-3 rounded-xl'}); let list=brands[j]; document.getElementById('brandBox').innerHTML=list.map(b=>`<button onclick="pilihB('${b}')" id="bb-${b}" class="bg-white border p-2 rounded-lg">${b}</button>`).join(''); pilihB(list[0]);}
function pilihB(b){brand=b; document.querySelectorAll('#brandBox button').forEach(e=>e.className='bg-white border p-2 rounded-lg'); document.getElementById('bb-'+b).className='bg-black text-white p-2 rounded-lg';}
function saveKas(){let k={kes:parseInt(kKes.value)||0,bca:parseInt(kBCA.value)||0,bri:parseInt(kBRI.value)||0,mandiri:parseInt(kMandiri.value)||0,dana:parseInt(kDANA.value)||0,ovo:parseInt(kOVO.value)||0,gopay:parseInt(kGOPAY.value)||0,spay:parseInt(kSPAY.value)||0}; localStorage.setItem('kas',JSON.stringify(k)); load(); alert('Kas disimpan');}
async function simpan(){let ket=document.getElementById('ket').value; let mod=parseInt(document.getElementById('mod').value)||0; let unt=parseInt(document.getElementById('unt').value)||0; if(!ket) return alert('isi ket'); await sb.from('transaksi').insert([{jenis:jenis.toLowerCase(), nama_barang:`${brand} ${ket}`, modal:mod, jual:mod+unt, untung:unt, jumlah:1}]); ket=''; mod=''; unt=''; document.getElementById('ket').value=''; document.getElementById('mod').value=''; document.getElementById('unt').value=''; load();}
async function load(){let {data}=await sb.from('transaksi').select('*').order('id',{ascending:false}).limit(200); let penj=0,non=0,tM=0,tP=0,setor=0; let hP='',hN='',hT='',hS=''; (data||[]).forEach(t=>{if(t.jenis=='penjualan'){penj+=t.jual; hP+=`<div class="flex justify-between border-b py-1"><span>${t.nama_barang}</span><span>Rp ${t.jual}</span></div>`} else if(t.jenis=='nonbarang'){non+=t.jual; hN+=`<div class="flex justify-between border-b py-1"><span>${t.nama_barang}</span><span>Rp ${t.jual}</span></div>`} else if(t.jenis=='tarik'){tM+=t.modal; tP+=t.untung; hT+=`<div class="flex justify-between border-b py-1"><span>${t.nama_barang}</span><span>-Rp ${t.modal} +${t.untung}</span></div>`} else if(t.jenis=='setoran'){setor+=t.jual; hS+=`<div class="flex justify-between border-b py-1"><span>${t.nama_barang}</span><span>Rp ${t.jual}</span></div>`}}); vPenj.innerText=penj.toLocaleString('id-ID'); vNon.innerText=non.toLocaleString('id-ID'); vTarikM.innerText=tM.toLocaleString('id-ID'); vTarikP.innerText=tP.toLocaleString('id-ID'); vSetor.innerText=setor.toLocaleString('id-ID'); cPenj.innerHTML=hP||'Kosong'; cNon.innerHTML=hN||'Kosong'; cTarik.innerHTML=hT||'Kosong'; cSetor.innerHTML=hS||'Kosong'; let kas=JSON.parse(localStorage.getItem('kas')||'{"kes":0,"bca":0,"bri":0,"mandiri":0,"dana":0,"ovo":0,"gopay":0,"spay":0}'); let stanby=Object.values(kas).reduce((a,b)=>a+b,0); vStanby.innerText=stanby.toLocaleString('id-ID'); cStanby.innerHTML=Object.entries(kas).map(([k,v])=>v>0?`<div class="flex justify-between border-b py-1"><span>${k.toUpperCase()}</span><span>Rp ${v.toLocaleString('id-ID')}</span></div>`:'').join('')||'Isi di atas'; kKes.value=kas.kes||''; kBCA.value=kas.bca||''; kBRI.value=kas.bri||''; kMandiri.value=kas.mandiri||''; kDANA.value=kas.dana||''; kOVO.value=kas.ovo||''; kGOPAY.value=kas.gopay||''; kSPAY.value=kas.spay||''; totalTr.innerText=(data||[]).length; totalUang.innerText='Rp. '+(stanby+penj+non+tP-setor).toLocaleString('id-ID');}
let d=new Date().toISOString().slice(0,10); tgl.innerText='TRANSAKSI TGL '+d; setJ('PENJUALAN'); load();
</script>
</body></html>
