<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konterku</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body class="bg-gray-50 p-4"><div class="max-w-md mx-auto">
<div class="bg-white rounded-2xl shadow p-4 mb-4 flex justify-between">
<b>RIMILLA STAY</b><span id="status" class="text-xs bg-yellow-100 px-3 py-1 rounded-full">Menghubungkan...</span>
</div>
<div class="bg-white rounded-2xl shadow p-4 mb-4">
<input id="nama" placeholder="Nama barang" class="w-full border rounded p-2 mb-2">
<div class="grid grid-cols-3 gap-2 mb-3">
<input id="modal" type="number" placeholder="Modal" class="border rounded p-2">
<input id="jual" type="number" placeholder="Jual" class="border rounded p-2">
<input id="sisa" type="number" placeholder="Jml" class="border rounded p-2">
</div>
<button onclick="tambahStok()" class="w-full bg-violet-600 text-white rounded-xl py-3 font-bold">SIMPAN KE SUPABASE (ONLINE)</button>
</div>
<div class="bg-white rounded-2xl shadow p-4"><div id="listStok">Loading...</div></div>
</div>
<script>
const supabaseClient = supabase.createClient("https://jmukkudafhilkbllirue.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdWtrdWRhZmhpbGtibGxpcnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mzg3NDUsImV4cCI6MjEwNjExNDc0NX0.BqxV1PS2Ypt5MSh5ItVDndOD05lrZdq_wFC9w1hDqXY");
async function init(){try{const {error}=await supabaseClient.from('stok').select('*').limit(1);if(error)throw error;document.getElementById('status').textContent='● ONLINE - Sinkron';document.getElementById('status').className='text-xs px-3 py-1 rounded-full bg-green-100 text-green-700 font-bold';loadStok();}catch(e){document.getElementById('status').textContent='OFFLINE: '+e.message}}
async function loadStok(){const {data}=await supabaseClient.from('stok').select('*').order('id',{ascending:false});document.getElementById('listStok').innerHTML=data.map(s=>`<div class='border rounded p-2 mb-1'><b>${s.nama}</b> sisa ${s.sisa}</div>`).join('')}
async function tambahStok(){const nama=document.getElementById('nama').value;const modal=parseInt(document.getElementById('modal').value);const jual=parseInt(document.getElementById('jual').value);const sisa=parseInt(document.getElementById('sisa').value);const {error}=await supabaseClient.from('stok').insert([{nama,modal,jual,sisa}]);if(error)alert(error.message);else loadStok()}
init();
</script></body></html>
